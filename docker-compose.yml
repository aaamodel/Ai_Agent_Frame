services:
  postgres:
    image: postgres:16-alpine
    container_name: Enterprise-aiagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    # 必须用 redis-stack-server（内置 RediSearch/RedisJSON 模块）：
    # LangGraph 的 AsyncRedisSaver.asetup() 依赖 FT.INFO/FT.CREATE，
    # 纯 redis:7-alpine 无此命令会导致 checkpointer 初始化失败、降级内存模式。
    image: redis/redis-stack-server:7.4.0-v2
    container_name: Enterprise-aiagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 镜像 Cmd=/entrypoint.sh（负责 loadmodule），额外参数走 REDIS_ARGS 环境变量
    environment:
      REDIS_ARGS: "--appendonly yes"
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: Enterprise-aiagent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: Enterprise-aiagent-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: Enterprise-aiagent-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Enterprise-aiagent-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  # 历史容器（旧 compose 项目 project-python）一直在用该卷，标记 external
  # 以保留 db0 短期记忆数据；勿让 compose 另建新空卷。
  redis_data:
    external: true
    name: project-python_redis_data
  etcd_data:
  minio_data:
  milvus_data: