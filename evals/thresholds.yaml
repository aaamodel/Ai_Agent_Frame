# =====================================================================
# eval 质量门（任一指标跌破即 CI 失败）
#
# 设计原则（对齐《评测-压测-监控落地手册》第 3.1/3.2/6 节）：
#   1. 阈值是**配置**不是代码——改阈值不改代码，可解释为"阈值可按业务调"。
#   2. 下面的数值是**保守初值**（低于手册建议值），目的是"首次 baseline 不误红"。
#      拿到真实 baseline 之后必须回来校准：合格线 = 首测值往下留 3~5 个点余量，
#      而不是拍脑袋写 0.9。这一條正是面试里"阈值来自实测基线"那句话的落点。
#   3. 键名约定：`*_min` 为下界（低于违规），`*_max` 为上界（高于违规）。
#      指标结果里没有对应键时该项**跳过**（不误报），便于"先建 eval 后发数据"。
# =====================================================================

# 阈值版本号：每次校准请递增，便于报告里追溯"这次红线是哪版标准"
version: 1

intent:
  accuracy_min: 0.80          # 意图分类整体准确率下限（初值；baseline 校准目标 0.87+）
  boundary_accuracy_min: 0.60 # 5 条易混淆边界样本单独设线（边界难，线要单独设）

rag:
  recall_at_5_min: 0.70       # Recall@5 下限（初值；校准目标 0.85+）
  hit_at_5_min: 0.80          # Hit@5 下限（"至少召回一个"的比例）
  mrr_min: 0.55               # MRR 下限（首个命中名次倒数均值）

tool:
  call_success_min: 0.75      # 工具调用成功率下限（初值；校准目标 0.85+）
  key_arg_recall_min: 0.60    # 关键参数命中率下限（仅统计有参数标注的用例）

answer:
  # 生成层（答案质量）。数据来源：evals/tools/grade_answers.py
  # 没跑生成层时这两项跳过，不会让质量门变红。
  pass_rate_min: 0.70          # 答案合格率下限（要点数达标且无干扰项）
  abstain_correct_rate_min: 0.60  # 应拒答样本中确实拒答的比例（抗幻觉能力）

cost:
  # 单轮 token 与延迟上限：先用架构预期值兜底，拿到压测/实测基线后必须下调到
  # "实测 P95 × 1.5" 这类可辩护的写法（手册第六节的告警口径）。
  avg_tokens_per_turn_max: 6000
  p95_latency_ms_max: 45000
